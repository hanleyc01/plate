[project]
name = "plate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Connor Hanley", email = "connordhanley@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[project.scripts]
plate = "plate:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipynb>=0.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
